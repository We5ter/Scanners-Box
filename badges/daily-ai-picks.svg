<svg xmlns="http://www.w3.org/2000/svg" width="128" height="20" viewBox="0 0 128 20">
  <defs>
    <clipPath id="c"><rect width="128" height="20" rx="3"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#c)">
    <rect width="128" height="20" fill="url(#bg)"/>
  </g>

  <!-- Calendar icon (24×24 path scaled to 11px) -->
  <g transform="translate(5,4.5) scale(0.458)">
    <path d="M7 2v3M17 2v3M3 9h18M5 5h14a1 1 0 011 1v13a1 1 0 01-1 1H5a1 1 0 01-1-1V6a1 1 0 011-1z"
          fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Divider -->
  <rect x="22" y="5" width="1" height="10" fill="rgba(255,255,255,0.3)" rx="0.5"/>

  <!-- "daily picks" label -->
  <text x="28" y="14" font-family="DejaVu Sans,Verdana,Geneva,sans-serif"
        font-size="10" fill="rgba(255,255,255,0.85)">daily picks</text>

  <!-- Right divider -->
  <rect x="86" y="5" width="1" height="10" fill="rgba(255,255,255,0.25)" rx="0.5"/>

  <!-- Value "new" -->
  <text x="107" y="14" text-anchor="middle"
        font-family="DejaVu Sans,Verdana,Geneva,sans-serif"
        font-size="11" fill="white" font-weight="700">new</text>
</svg>
